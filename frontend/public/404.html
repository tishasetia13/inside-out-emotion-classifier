<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found · Inside Out Emotion Classifier</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f7f4ee" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1rem;
        background: #f7f4ee;
        color: #1a1814;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        text-align: center;
      }
      main {
        max-width: 26rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.75rem;
      }
      p {
        margin: 0 0 1.5rem;
        color: #5c5750;
        line-height: 1.6;
      }
      a {
        display: inline-block;
        padding: 0.75rem 1.5rem;
        border-radius: 0.875rem;
        background: #1a1814;
        color: #f7f4ee;
        font-weight: 700;
        text-decoration: none;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #141311;
          color: #f2efe8;
        }
        p {
          color: #a8a298;
        }
        a {
          background: #f2efe8;
          color: #141311;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>The page you were looking for doesn't exist.</p>
      <a href="/">Back to the classifier</a>
    </main>
  </body>
</html>
